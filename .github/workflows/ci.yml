name: cerebra-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # NFR-TE-1, TR-5: NO live API calls in PR CI
    env:
      PYTHONPATH: src
      CEREBRA_QUOTA_BUDGET: "1000"
      CEREBRA_SEARCH_BUDGET: "10"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (pinned, NFR-SE-6)
        run: pip install -r requirements.lock && pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, strict scope per pyproject)
        run: mypy

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

      - name: Run property tests (Hypothesis)
        run: pytest tests/property -v --tb=short

      - name: Run contract tests
        run: pytest tests/contract -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short

      - name: Run MCP e2e tests (fixture provider)
        run: pytest tests/mcp_e2e -v --tb=short

      - name: Run security tests
        run: pytest tests/security -v --tb=short

      - name: Coverage report
        run: |
          pytest tests/ \
            --cov=cerebra \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --log-opts="origin/main..HEAD" -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate SKILL.md files
        run: python scripts/validate_skills.py

      - name: Validate brain notes
        run: python scripts/validate_brain.py

      - name: Check traceability matrix (PR-4)
        run: python scripts/traceability.py

  # NFR-SE-6: dependency vulnerability scan
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.lock
      - run: pip-audit -r requirements.lock --no-deps
